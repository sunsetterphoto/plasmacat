[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasmacat"
version = "0.2.2"
description = "Pixel-art desktop companion cat for KDE Plasma (Wayland)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Qt only. Fedora users can rely on the distro package python3-pyside6.
dependencies = [
    "PySide6-Essentials>=6.6",
    "PySide6-Addons>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plasmacat = "plasmacat.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasmacat = ["data/*", "data/**/*"]
