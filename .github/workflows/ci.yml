name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: System libraries for headless Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libpulse0 libpulse-mainloop-glib0 libglib2.0-0
      - name: Install Python dependencies
        run: pip install PySide6-Essentials PySide6-Addons pytest
      - name: Python tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
      - name: KWin bridge tests
        run: |
          node --test tests/*.test.mjs
